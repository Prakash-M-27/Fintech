[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-agent-system"
version = "0.1.0"
description = "Rules-based, multi-agent trading-assistant system for currency markets"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langsmith>=0.1",
    "mcp>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "backtrader>=1.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["graph*", "mcp_wrappers*", "rules*", "risk*", "backtest*", "eval*", "config*", "storage*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
