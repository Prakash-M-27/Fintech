version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_test
      POSTGRES_DB: neondb
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d neondb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend (FastAPI + Socket.IO) ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # DB — uses local postgres container (not NeonDB) inside Docker
      DATABASE_URL: postgresql://neondb_owner:npg_test@postgres:5432/neondb
      DB_SSL: disable
      REDIS_URL: redis://redis:6379/0

      # Market data API keys (passed from host .env)
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      FRANKFUTER_BASE_URL: https://api.frankfurter.dev/v2
      USD_POLL_INTERVAL: 30
      CACHE_TTL: 60

      # Agent / AI keys
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}

      # Agent behaviour
      NEWS_AGENT_POLL_INTERVAL: ${NEWS_AGENT_POLL_INTERVAL:-300}
      SIGNAL_ACTION_THRESHOLD: ${SIGNAL_ACTION_THRESHOLD:-0.6}

      # Paper-trading capital (virtual INR — no real money)
      TOTAL_CAPITAL: ${TOTAL_CAPITAL:-100000}
      MAX_TRADE_AMOUNT: ${MAX_TRADE_AMOUNT:-5000}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:--3}
      TAKE_PROFIT_PCT: ${TAKE_PROFIT_PCT:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Points the Next.js API routes at the backend container
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      # Groq key for the /api/groq-analysis Next.js API route
      GROQ_API_KEY: ${GROQ_API_KEY}
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
