version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_test
      POSTGRES_DB: neondb
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d neondb"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_test@postgres:5432/neondb
      DB_SSL: disable
      REDIS_URL: redis://redis:6379/0
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      FRANKFUTER_BASE_URL: https://api.frankfurter.dev/v2
      USD_POLL_INTERVAL: 30
      CACHE_TTL: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  pg_data: